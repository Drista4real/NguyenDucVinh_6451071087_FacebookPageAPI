services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -c
      - |
        for topic in raw_events reply_commands send_retry send_failed dead_letter; do
          kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
            --topic "$$topic" --partitions 1 --replication-factor 1
        done

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: fb-api-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: fb_api_db
      POSTGRES_USER: fb_api_user
      POSTGRES_PASSWORD: fb_api_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fb_api_user -d fb_api_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend-api:
    build:
      context: ./BackendAPI
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      ASPNETCORE_URLS: http://+:3000
      ASPNETCORE_ENVIRONMENT: Development
      Facebook__ApiVersion: v25.0
      Facebook__PageAccessToken: ${FACEBOOK_PAGE_ACCESS_TOKEN:-}
      Facebook__DefaultPageId: ${FACEBOOK_PAGE_ID:-}
      Dashboard__ApiKey: ${DASHBOARD_API_KEY:-}
      Kafka__Enabled: "true"
      Kafka__BootstrapServers: kafka:29092
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=fb_api_db;Username=fb_api_user;Password=fb_api_password

  webhook-service:
    build:
      context: ./Webhook-Service
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "3001:3001"
    environment:
      ASPNETCORE_URLS: http://+:3001
      ASPNETCORE_ENVIRONMENT: Development
      Facebook__VerifyToken: ${FACEBOOK_WEBHOOK_VERIFY_TOKEN:-}
      Facebook__AppSecret: ${FACEBOOK_APP_SECRET:-}
      Kafka__BootstrapServers: kafka:29092
      Kafka__RawEventsTopic: raw_events

  core-service:
    build:
      context: ./CoreService
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "3002:3002"
    environment:
      ASPNETCORE_URLS: http://+:3002
      ASPNETCORE_ENVIRONMENT: Development
      Kafka__BootstrapServers: kafka:29092
      Kafka__Topics__RawEvents: raw_events
      Kafka__Topics__ReplyCommands: reply_commands
      AiApi__Provider: OpenAI
      AiApi__OpenAi__ApiKey: ${OPENAI_API_KEY:-}
      AiApi__OpenAi__Model: ${OPENAI_MODEL:-gpt-5.4-mini}
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=fb_api_db;Username=fb_api_user;Password=fb_api_password

  retry-service:
    build:
      context: ./Retry-Service
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "3003:3003"
    environment:
      ASPNETCORE_URLS: http://+:3003
      ASPNETCORE_ENVIRONMENT: Development
      Kafka__BootstrapServers: kafka:29092
      Kafka__Topics__SendFailed: send_failed
      Kafka__Topics__SendRetry: send_retry
      Kafka__Topics__DeadLetter: dead_letter
      RetryPolicy__MaxRetryAttempts: 5
      RetryPolicy__InitialBackoffSeconds: 1
      RetryPolicy__BackoffMultiplier: 2.0
      RetryPolicy__MaxBackoffSeconds: 300

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9308:9308"
    command:
      - --kafka.server=kafka:29092

  prometheus:
    image: prom/prometheus:latest
    depends_on:
      - kafka-exporter
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus

  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

volumes:
  postgres_data:
  prometheus_data:
