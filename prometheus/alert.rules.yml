groups:
  - name: kafka_alerts
    rules:
      - alert: DeadLetterQueueReceived
        expr: increase(kafka_topic_partition_current_offset{topic="dead_letter"}[1m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Message received in Dead Letter Queue
          description: Check topic dead_letter in Kafka UI at http://localhost:8080.

      - alert: KafkaConsumerLagHigh
        expr: kafka_consumergroup_lag > 500
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Kafka consumer lag is high
          description: Consumer {{ $labels.consumergroup }} is behind by {{ $value }} messages.
